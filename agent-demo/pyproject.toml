description = "LangGraph agent demo backed by DeepSeek"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ag-ui-protocol>=1.0,<2",
    "fastapi>=0.115",
    "langchain>=1.4.6",
    "langchain-deepseek>=1.1.1",
    "langchain-huggingface>=1.2.3",
    "langgraph>=1.2.16",
    "langgraph-checkpoint-postgres>=3.2.0",
    "mcp>=2.3.0,<3",
    "numpy>=2.2.6",
    "psycopg[binary,pool]>=3.3.6",
    "python-dotenv>=1.0.0",
    "sentence-transformers>=6.1.0",
    "uvicorn>=0.32",
]

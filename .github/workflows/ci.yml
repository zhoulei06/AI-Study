name: Agent and frontend checks

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: study
          POSTGRES_PASSWORD: study
          POSTGRES_DB: study
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U study -d study"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: agent-server
    env:
      MEMORY_DATABASE_URL: postgresql://study:study@127.0.0.1:5432/study
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check agent tests
      - run: uv run python -m unittest discover -s tests -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10.9.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: front/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build

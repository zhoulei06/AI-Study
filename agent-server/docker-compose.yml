# Keep the existing Compose project and PostgreSQL volume after directory rename.
name: agent-demo

services:
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: study
      POSTGRES_PASSWORD: study
      POSTGRES_DB: study
    volumes:
      - study-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U study -d study"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  study-pg:

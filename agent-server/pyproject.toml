[project]
name = "agent-server"
version = "0.1.0"
description = "LangGraph agent service with durable history and AG-UI streaming"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ag-ui-langgraph==0.0.47",
    "ag-ui-protocol>=1.0,<2",
    "fastapi>=0.115",
    "httpx>=0.28,<1",
    "httpx2>=2.13,<3",
    "langchain>=1.4.6",
    "langchain-deepseek>=1.1.1",
    "langchain-huggingface>=1.2.3",
    "langgraph>=1.2.16",
    "langgraph-checkpoint-postgres>=3.2.0",
    "mcp>=2.3.0,<3",
    "numpy>=2.2.6",
    "psycopg[binary,pool]>=3.3.6",
    "python-dotenv>=1.0.0",
    "sentence-transformers>=6.1.0",
    "uvicorn>=0.32",
]

[tool.ruff.lint]
select = ["F", "E9"]

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]
